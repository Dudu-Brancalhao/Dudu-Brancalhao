<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <style>
    .leaf { transform-box: fill-box; transform-origin: 2% 97%; animation: sway 6s ease-in-out infinite; }
    .dot1 { animation: float 5s ease-in-out infinite; }
    .dot2 { animation: float 7s ease-in-out infinite reverse; }
    .glow { animation: pulse 8s ease-in-out infinite; }
    .t1 { animation: rise 1s ease-out both; }
    .t2 { animation: rise 1s ease-out .25s both; }
    .t3 { animation: rise 1s ease-out .5s both; }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  </style>
