    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d7bff"/><stop offset="1" stop-color="#4d7bff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="260" rx="18"/></clipPath>
